<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <script src="operation-logic.js" defer></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="container">
    <div class="display">display</div>

    <div id="operand-container">
      <div class="all-clear">AC</div>
      <div class="PN">+/-</div>
      <div class="percent">%</div>
      <div class="equal">=</div>

      <div class="num">7</div>
      <div class="num">8</div>
      <div class="num">9</div>
      <div class="operator plus">+</div>

      <div class="num">4</div>
      <div class="num">5</div>
      <div class="num">6</div>
      <div class="operator subtract">-</div>

      <div class="num">1</div>
      <div class="num">2</div>
      <div class="num">3</div>
      <div class="operator multiply">*</div>

      <div class="num0">0</div>
      <div class="decimal">.</div>
      <div class="operator divide">/</div>

    </div>
  </div>
</body>

</html>
